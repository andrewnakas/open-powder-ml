[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-powder-ml"
version = "0.1.0"
description = "An open-source ML competitor for PowderBench: daily calibrated mountain-snowfall forecasts, fully automated on GitHub Actions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15",
    "PyYAML>=6.0",
    "typer>=0.12",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
terrain = ["rasterio>=1.3"]

[project.scripts]
opm = "opm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/opm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real external APIs (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "B023", "B905"]
