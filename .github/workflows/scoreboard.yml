# Our standing on every PowderBench board, rendered into README + docs/.
name: Scoreboard

on:
  schedule:
    - cron: "40 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scoreboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: opm scoreboard
      - name: Commit
        run: |
          git config user.name "open-powder-ml bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/scoreboard.md
          git diff --cached --quiet && exit 0
          git commit -qm "scoreboard: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
